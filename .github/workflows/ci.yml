
name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building application..."
          bash app.sh

      - name: Test
        run: |
          echo "Testing application..."
          test -f app.sh

      - name: Deployment
        run: |
          echo "Deployment completed successfully!"
